apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: app
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: app
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Pod Identity: el role se asume via EKS Pod Identity, sin credenciales en el pod
      auth:
        jwt:
          secretRef:
            name: pod-identity-webhook
---
# Los secrets NO se escriben como YAML: se importan desde Secrets Manager (cifrado KMS)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-db-secret
  namespace: app
spec:
  target:
    name: app-db
    creationPolicy: Owner
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: eks-zero-trust/app/db
        property: password