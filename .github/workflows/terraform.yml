name: Terraform Zero-Trust Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform fmt check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform init
        id: init
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform validate
        run: |
          cd terraform
          terraform validate

      - name: Checkov scan (IaC security)
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          download_external_modules: false

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0
      - name: Init TFLint
        run: cd terraform && tflint --init
      - name: Run TFLint
        run: cd terraform && tflint

      - name: Comment Checkov results on PR
        if: github.event_name == 'pull_request' && (steps.checkov.outcome == 'failure' || steps.checkov.outcome == 'success')
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            })
            core.notice(`Checkov complete. Ver comentarios del run.`)

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: terraform/**/*.html
          if-no-files-found: ignore