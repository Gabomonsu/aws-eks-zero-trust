version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(terraform)"

  - package-ecosystem: "terraform"
    directory: "/terraform/modules/kms"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/modules/vpc"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/modules/eks"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/terraform/modules/irsa"
    schedule:
      interval: "weekly"